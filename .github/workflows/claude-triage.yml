name: Claude Issue Triage

on:
  issues:
    types: [labeled]

jobs:
  claude-triage:
    if: github.event.label.name == 'needs-elaboration'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1.0.70
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            GitHub issue #${{ github.event.issue.number }} ("${{ github.event.issue.title }}") has been labeled "needs-elaboration" and requires your analysis.

            Review issue #${{ github.event.issue.number }}, its body, and all existing comments carefully.

            If the issue body or comments contain external URLs, fetch their content using agent-browser
            before proceeding — this is essential for questions that reference external documentation
            or live deployments:
              npx agent-browser open <url>
              npx agent-browser get text

            Then:

            1. Answer any open questions posed in the issue or its comments. Post your answers as a
               comment on issue #${{ github.event.issue.number }}.
            2. Remove the "needs-elaboration" label from issue #${{ github.event.issue.number }}.

            Never add the "ready-for-dev" label to an issue, and never create an issue that
            carries it. Only a person applies that label. A bot that applies it starts the
            Claude Issue Implementation workflow, which then stops at once with "Workflow
            initiated by non-human actor". If you make an issue that is ready to implement,
            say so in the issue body and leave the label to the owner.

            Be concise and concrete. Reference specific file paths and function names where applicable.
          claude_args: "--model claude-sonnet-5 --max-turns 30 --dangerously-skip-permissions"
          show_full_output: "true"
