name: Claude Visual Check

# The acceptance checks of an issue, run in the browser against the dev server.
#
# This work is split out of "Claude Issue Implementation" because it used most
# of that workflow's turns and ran last, so the run often stopped at the turn
# limit with the "## Visual Verification" section still on "Pending.". A
# separate run gets its own turn limit, and the branch is already pushed, so it
# risks nothing.

on:
  pull_request:
    types: [labeled]

jobs:
  claude-visual-check:
    if: github.event.label.name == 'visual-check'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      # Install before Claude starts, so no turns go to the install and the
      # first command does not fail. The yarn cache holds `agent-browser` too.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # A re-run means the last reason is no longer current. Clearing the label
      # here keeps an `agent-error:` label on a pull request only while it is true, so a
      # stale one never outlives the failure it described.
      - name: Clear any agent-error label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" --jq '.[].name' \
            | grep '^agent-error:' \
            | while read -r label; do
                gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/$label" -X DELETE >/dev/null
                echo "removed $label"
              done || true

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1.0.234
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The implementation workflow adds the `visual-check` label as
          # `claude[bot]`, and the action refuses a bot-started run by default.
          allowed_bots: "claude[bot]"
          prompt: |
            Pull request #${{ github.event.pull_request.number }} ("${{ github.event.pull_request.title }}") is labeled "visual-check". Its branch is checked out. Your job is to run the acceptance checks in the browser and to report what you saw.

            You write the "## Visual Verification" section of this pull request. Another agent wrote the code and did a short smoke check. It did not run the acceptance checks.

            1. Read the pull request and the issue it closes:
               `gh pr view ${{ github.event.pull_request.number }}`
               `gh issue view <the issue number in "Closes #...">`
               The "## Acceptance checks" section of the issue is your list. Read "Browser checks" in AGENTS.md as well.

            2. Start the dev server: `NEXT_PUBLIC_AGENT_BROWSER=1 yarn dev`. It runs at http://localhost:3000.
               This hides the consent banner and the Next.js dev tools button, which cover elements that the check clicks and drags.
               The dependencies are installed already, and `agent-browser` is one of them, so `npx agent-browser` runs the local copy and downloads nothing. Do not run `yarn install`.

            3. Open the page the pull request affects. For the practice table, use `/decks/practice?fixture=1`. For the deck builder, use `/decks?fixture=1`. The fixture gives you a deck with cards, so the empty state does not hide what you check.
               Use the viewport the issue names. If the issue names none, use the default viewport.

            4. Run every acceptance check of the issue, one at a time. Record the result of each one.
               For a drag on the practice table, use the script. Do not build the drag by hand, and do not
               debug a drag that does not land — the script already handles the two reasons it fails:
               `bash scripts/practice_drag.sh <card-id> <data-zone>`
               It prints the zone the card ended in, or `pile` for a mission pile, whose cards are not in
               the DOM. Read "Browser checks" in AGENTS.md before you use it.
               If your commands do not build the state a check needs, say so in the report. Do not report a check as passed when you did not run it.

               You have a turn limit, and one Bash call is one turn. To stay inside it, put the whole
               command sequence of one acceptance check in ONE Bash call, one command per line, and
               end the call with the `snapshot` or `eval` that reads the result. For example:

               ```
               npx agent-browser click 'ref=e8'
               npx agent-browser eval "(()=>{const b=Array.from(document.querySelectorAll('button')).find(x=>x.textContent.trim()==='Stop');b.click();return 'clicked'})()"
               npx agent-browser eval "document.querySelector('[data-card-id]').className"
               ```

               The middle line clicks through the DOM on purpose. `click 'button:has-text("...")'`
               reports success on this page and the button does not fire. See "A click that does
               not click" in AGENTS.md.

               Do not take a snapshot after every click. Take one at the end of the sequence, and read
               the state you need with one `eval` instead of a full snapshot where you can.
               Do not run `npx agent-browser --help`. The commands you need are in AGENTS.md.
               A run that ends at the turn limit writes no report, so budget the turns from the start.

            5. Read the browser console and the dev server log for errors before you stop the server.

            6. If a check fails because of a bug in the code, fix the bug.
               a. Run `yarn test` and `yarn build`. Both must pass.
               b. Commit with a message like `fix: <short description> (follow-up for #${{ github.event.pull_request.number }})`.
               c. Run `git pull --rebase`, then `git push origin HEAD`. Never force-push. Other workflows push to this branch too.
               d. Run the failed check again.

            7. Write the report:
               a. Write your report to a file, for example `/tmp/visual-verification.md`. Write the text of the section only, with no "## Visual Verification" heading line.
                  Name each page you visited, each viewport, each acceptance check, and its result. A reader must be able to tell a check you ran from a check you could not run.
                  Then put the file into the pull request body with this script:
                  `bash scripts/replace_pr_section.sh ${{ github.event.pull_request.number }} "## Visual Verification" /tmp/visual-verification.md`
                  The script reads the current body, swaps the text of that one section, and writes the body back with `--body-file`.
                  Never call `gh pr edit --body`. That replaces the whole body, and it drops the `Closes #<issue>` line. A merge then closes no issue.
               b. If the dev server or `agent-browser` failed, write the full error output to a second file and add it the same way. Do NOT omit this.
                  `bash scripts/replace_pr_section.sh --add-if-missing ${{ github.event.pull_request.number }} "## Dev Server Issues" /tmp/dev-server-issues.md`
               c. Mark the pull request ready for review: `gh pr ready ${{ github.event.pull_request.number }}`.
                  Leave it as a draft if an acceptance check failed and you could not fix it. Say why in the report, and add the `needs-human-input` label.

            8. Remove the "visual-check" label, so the workflow does not start again:
               `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/visual-check -X DELETE`

            Never add the "ready-for-dev" label to an issue or a pull request. Only a person applies that label.

            Report what you saw. Do not change code except to fix a bug that an acceptance check found. Reference AGENTS.md for project conventions and commands.
          claude_args: "--model claude-opus-5-5 --max-turns 150 --dangerously-skip-permissions"
          show_full_output: "true"
